/**:
  ros__parameters:

    lidar_frame: "lidar_link"
    lidar_hostname: ""
    driver_hostname: ""         # this host's IP on the lidar network (required for now)
    lidar_udp_port: 2115
    sopas_tcp_port: 2111        # 2111 = CoLa A, 2112 = CoLa B (firmware 2.3)
    use_cola_binary: false      # must match the port above
    udp_reset_timeout: 2.
    sopas_read_timeout: 3.
    error_restart_timeout: 3.
    # 1-based echo to publish; falls back to the first echo the sensor sends.
    # With the sensor's echo filter on "first" or "last" only one echo is sent.
    echo_selection: 1

    output:
      # any subset containing x, y, z; fields are always packed in this order
      point_fields: ["x", "y", "z", "intensity", "range", "azimuth", "elevation",
                     "layer", "echo", "index", "tl", "th", "reflective"]
